<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0f00"/>
      <stop offset="100%" stop-color="#0d0800"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff8800" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff8800" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- Glow -->
  <ellipse cx="100" cy="70" rx="90" ry="80" fill="url(#glow)" filter="url(#blur)"/>
  <!-- Light beam rays -->
  <line x1="100" y1="70" x2="20" y2="10" stroke="#ff8800" stroke-width="0.8" opacity="0.3"/>
  <line x1="100" y1="70" x2="60" y2="5" stroke="#ff8800" stroke-width="0.8" opacity="0.3"/>
  <line x1="100" y1="70" x2="100" y2="0" stroke="#ff8800" stroke-width="0.8" opacity="0.3"/>
  <line x1="100" y1="70" x2="140" y2="5" stroke="#ff8800" stroke-width="0.8" opacity="0.3"/>
  <line x1="100" y1="70" x2="180" y2="10" stroke="#ff8800" stroke-width="0.8" opacity="0.3"/>
  <line x1="100" y1="70" x2="10" y2="50" stroke="#ffaa00" stroke-width="0.5" opacity="0.2"/>
  <line x1="100" y1="70" x2="190" y2="50" stroke="#ffaa00" stroke-width="0.5" opacity="0.2"/>
  <!-- Central light source -->
  <circle cx="100" cy="70" r="8" fill="#ffcc44" opacity="0.9"/>
  <circle cx="100" cy="70" r="14" fill="#ff8800" opacity="0.4" filter="url(#blur)"/>
  <!-- Title -->
  <text x="100" y="125" font-family="monospace" font-size="11" font-weight="bold" fill="#ff8800" text-anchor="middle" letter-spacing="0.5">BLINDING LIGHTS</text>
  <text x="100" y="142" font-family="monospace" font-size="10" fill="#ccaa88" text-anchor="middle">THE WEEKND</text>
  <text x="100" y="180" font-family="monospace" font-size="9" fill="#ff8800" text-anchor="middle" opacity="0.8">171 BPM</text>
  <!-- Note arrows decoration -->
  <text x="30" y="175" font-family="monospace" font-size="18" fill="#ffaa44" opacity="0.4" text-anchor="middle">←</text>
  <text x="70" y="175" font-family="monospace" font-size="18" fill="#ffaa44" opacity="0.4" text-anchor="middle">↓</text>
  <text x="130" y="175" font-family="monospace" font-size="18" fill="#ffaa44" opacity="0.4" text-anchor="middle">↑</text>
  <text x="170" y="175" font-family="monospace" font-size="18" fill="#ffaa44" opacity="0.4" text-anchor="middle">→</text>
  <!-- Border glow -->
  <rect x="1" y="1" width="198" height="198" rx="4" fill="none" stroke="#ff8800" stroke-width="1.5" opacity="0.6"/>
</svg>
