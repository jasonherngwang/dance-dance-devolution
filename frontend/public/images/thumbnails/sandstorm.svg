<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0040"/>
      <stop offset="100%" stop-color="#0d0010"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff00ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff00ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- Glow -->
  <ellipse cx="100" cy="80" rx="80" ry="70" fill="url(#glow)" filter="url(#blur)"/>
  <!-- Sand wave lines -->
  <path d="M0,130 Q50,110 100,130 Q150,150 200,130" fill="none" stroke="#ff00ff" stroke-width="1.5" opacity="0.4"/>
  <path d="M0,145 Q50,125 100,145 Q150,165 200,145" fill="none" stroke="#ff00ff" stroke-width="1" opacity="0.3"/>
  <path d="M0,160 Q50,140 100,160 Q150,180 200,160" fill="none" stroke="#ff44ff" stroke-width="0.8" opacity="0.2"/>
  <!-- Title -->
  <text x="100" y="95" font-family="monospace" font-size="14" font-weight="bold" fill="#ff00ff" text-anchor="middle" letter-spacing="1">SANDSTORM</text>
  <text x="100" y="115" font-family="monospace" font-size="10" fill="#cc88cc" text-anchor="middle">DARUDE</text>
  <text x="100" y="180" font-family="monospace" font-size="9" fill="#ff00ff" text-anchor="middle" opacity="0.8">136 BPM</text>
  <!-- Note arrows decoration -->
  <text x="30" y="55" font-family="monospace" font-size="18" fill="#ff44ff" opacity="0.5" text-anchor="middle">←</text>
  <text x="70" y="55" font-family="monospace" font-size="18" fill="#ff44ff" opacity="0.5" text-anchor="middle">↓</text>
  <text x="130" y="55" font-family="monospace" font-size="18" fill="#ff44ff" opacity="0.5" text-anchor="middle">↑</text>
  <text x="170" y="55" font-family="monospace" font-size="18" fill="#ff44ff" opacity="0.5" text-anchor="middle">→</text>
  <!-- Border glow -->
  <rect x="1" y="1" width="198" height="198" rx="4" fill="none" stroke="#ff00ff" stroke-width="1.5" opacity="0.6"/>
</svg>
