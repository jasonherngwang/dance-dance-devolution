<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#001a2a"/>
      <stop offset="100%" stop-color="#00080f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- Glow -->
  <ellipse cx="100" cy="80" rx="80" ry="70" fill="url(#glow)" filter="url(#blur)"/>
  <!-- Butterfly wings (simplified) -->
  <path d="M100,100 Q60,60 30,80 Q60,110 100,100" fill="#00ffff" opacity="0.15"/>
  <path d="M100,100 Q140,60 170,80 Q140,110 100,100" fill="#00ffff" opacity="0.15"/>
  <path d="M100,100 Q65,130 40,115 Q65,100 100,100" fill="#00ccff" opacity="0.1"/>
  <path d="M100,100 Q135,130 160,115 Q135,100 100,100" fill="#00ccff" opacity="0.1"/>
  <!-- Wing outlines -->
  <path d="M100,100 Q60,60 30,80 Q60,110 100,100" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.5"/>
  <path d="M100,100 Q140,60 170,80 Q140,110 100,100" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.5"/>
  <!-- Title -->
  <text x="100" y="95" font-family="monospace" font-size="13" font-weight="bold" fill="#00ffff" text-anchor="middle" letter-spacing="1">BUTTERFLY</text>
  <text x="100" y="113" font-family="monospace" font-size="10" fill="#88cccc" text-anchor="middle">SMILE.DK</text>
  <text x="100" y="180" font-family="monospace" font-size="9" fill="#00ffff" text-anchor="middle" opacity="0.8">154 BPM</text>
  <!-- Note arrows decoration -->
  <text x="30" y="55" font-family="monospace" font-size="18" fill="#44ffff" opacity="0.5" text-anchor="middle">←</text>
  <text x="70" y="55" font-family="monospace" font-size="18" fill="#44ffff" opacity="0.5" text-anchor="middle">↓</text>
  <text x="130" y="55" font-family="monospace" font-size="18" fill="#44ffff" opacity="0.5" text-anchor="middle">↑</text>
  <text x="170" y="55" font-family="monospace" font-size="18" fill="#44ffff" opacity="0.5" text-anchor="middle">→</text>
  <!-- Border glow -->
  <rect x="1" y="1" width="198" height="198" rx="4" fill="none" stroke="#00ffff" stroke-width="1.5" opacity="0.6"/>
</svg>
